name: Vulcan Materials Company
description: >-
  Vulcan Materials Company is the nation's largest producer of construction aggregates,
  primarily crushed stone, sand, and gravel, and a major producer of asphalt mix and
  ready-mixed concrete. Headquartered in Birmingham, Alabama, Vulcan serves all 50
  states and operates over 400 quarries and plants. As a Fortune 500 company, Vulcan
  serves the construction industry with materials critical for roads, bridges, buildings,
  and infrastructure. Vulcan does not publish a public developer API ecosystem; their
  digital operations focus on internal ERP systems, supplier portals, and customer
  order management platforms.
